<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Покупки из Китая</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f9;
    --card: #ffffff;
    --text: #1c1c1e;
    --muted: #8a8a8e;
    --border: #e2e2e6;
    --accent: #d92c27;
    --accent2: #2c7be5;
    --done-bg: #eef0ee;
    --pin-bg: #fff8e1;
    --pin-border: #e0a800;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --card: #232426;
      --text: #f0f0f2;
      --muted: #9a9a9e;
      --border: #333437;
      --done-bg: #1b1c1e;
      --pin-bg: #2e2712;
      --pin-border: #e0a800;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
    max-width: 640px;
    margin: 0 auto;
  }
  h1 {
    font-size: 20px;
    margin: 12px 0 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .rate-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .rate-box input {
    width: 70px;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 6px;
    background: transparent;
    color: var(--text);
    font-size: 13px;
  }
  .add-form {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 18px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
  }
  .add-form.editing {
    border-color: var(--accent2);
  }
  .add-form-actions {
    display: flex;
    gap: 8px;
  }
  .add-form-actions .btn-add { flex: 1; }
  .btn-cancel {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 10px 14px;
  }
  .sort-toggle {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }
  .sort-toggle button {
    flex: 1;
    padding: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 13px;
  }
  .sort-toggle button.active {
    background: var(--accent2);
    color: white;
    border-color: var(--accent2);
  }
  .row2 {
    display: grid;
    grid-template-columns: 1fr 90px 70px;
    gap: 8px;
  }
  .add-form input, .add-form select {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 14px;
    background: var(--bg);
    color: var(--text);
    width: 100%;
  }
  .priority-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .priority-row input[type=range] { flex: 1; }
  .priority-val {
    min-width: 26px;
    text-align: center;
    font-weight: 600;
    font-size: 14px;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
  }
  .btn-add {
    background: var(--accent2);
    color: white;
    padding: 10px;
  }
  ul.items {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  li.item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  li.item.done {
    background: var(--done-bg);
    opacity: 0.6;
  }
  li.item.done .name {
    text-decoration: line-through;
  }
  li.item.pinned {
    background: var(--pin-bg);
    border-color: var(--pin-border);
  }
  li.item.dragover {
    border-color: var(--accent2);
    border-style: dashed;
  }
  .handle {
    cursor: grab;
    color: var(--muted);
    font-size: 16px;
    flex-shrink: 0;
    touch-action: none;
    user-select: none;
  }
  .check {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    accent-color: var(--accent2);
  }
  .info {
    flex: 1;
    min-width: 0;
  }
  .name {
    font-size: 15px;
    font-weight: 500;
    overflow-wrap: break-word;
  }
  .prices {
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 2px;
  }
  .prio {
    font-size: 12px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--accent);
    color: white;
    flex-shrink: 0;
    min-width: 24px;
    text-align: center;
  }
  .prio.low { background: #8a8a8e; }
  .prio.mid { background: #e0a800; }
  .icon-btn {
    background: transparent;
    color: var(--muted);
    font-size: 16px;
    padding: 2px 6px;
    flex-shrink: 0;
    line-height: 1;
  }
  .icon-btn.pin.active {
    color: var(--pin-border);
  }
  .del { font-size: 18px; }
  .move-controls { display: flex; flex-direction: column; gap: 2px; }
  .move-controls button { font-size: 12px; }
  .move-controls button:disabled { opacity: 0.35; cursor: default; }
  .status { color: var(--accent); font-size: 13px; min-height: 1.2em; margin: 6px 0; }
  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 30px 0;
  }
</style>
</head>
<body>

<h1>🛒 Покупки из Китая</h1>

<div class="rate-box">
  <label for="rate">Курс: 1 CNY =</label>
  <input type="number" id="rate" step="any" min="0.000001" inputmode="decimal" required aria-describedby="rateUnit">
  <span id="rateUnit">KZT</span>
</div>

<form class="add-form" id="addForm">
  <input type="text" id="name" placeholder="Название товара" aria-label="Название товара" required>
  <div class="row2">
    <input type="number" id="price" step="any" min="0.000001" inputmode="decimal" placeholder="Цена" aria-label="Цена" required>
    <select id="currency" aria-label="Валюта цены">
      <option value="CNY">CNY ¥</option>
      <option value="KZT">KZT ₸</option>
    </select>
    <button class="btn-add" id="addBtn" type="submit" aria-label="Добавить товар">+</button>
  </div>
  <div class="priority-row">
    <label for="priority" style="font-size:13px;color:var(--muted)">Важность</label>
    <input type="range" id="priority" min="0" max="10" value="5">
    <span class="priority-val" id="priorityVal">5</span>
  </div>
  <div class="add-form-actions" id="editActions" style="display:none">
    <button class="btn-cancel" id="cancelBtn" type="button">Отмена</button>
  </div>
</form>

<div class="sort-toggle" role="group" aria-label="Порядок списка">
  <button id="sortByPriority" class="active" type="button">По важности</button>
  <button id="sortByManual" type="button">Вручную (перетаскивание)</button>
</div>

<ul class="items" id="list"></ul>
<div class="empty" id="emptyMsg" style="display:none">Список пуст</div>
<div class="status" id="status" role="status" aria-live="polite"></div>

<script>
const STORAGE_KEY = 'buy_calculate_items';
const RATE_KEY = 'buy_calculate_rate';
const SORT_KEY = 'buy_calculate_sort';
const DEFAULT_RATE = 74; // 1 CNY ≈ 74 KZT, edit as needed

function readStorage(key) {
  try { return localStorage.getItem(key); } catch { return null; }
}

function writeStorage(key, value) {
  try {
    localStorage.setItem(key, value);
    return true;
  } catch {
    document.getElementById('status').textContent = 'Не удалось сохранить изменения в этом браузере.';
    return false;
  }
}

function validNumber(value) {
  const number = Number(value);
  return Number.isFinite(number) && number > 0 ? number : null;
}

function loadItems() {
  try {
    const parsed = JSON.parse(readStorage(STORAGE_KEY) || '[]');
    if (!Array.isArray(parsed)) return [];
    return parsed.filter(it => it && typeof it === 'object'
      && (typeof it.id === 'number' || typeof it.id === 'string')
      && typeof it.name === 'string' && it.name.trim()
      && validNumber(it.price) !== null
      && (it.currency === 'CNY' || it.currency === 'KZT'))
      .map((it, idx) => ({
        id: it.id, name: it.name, price: Number(it.price), currency: it.currency,
        priority: Number.isInteger(Number(it.priority)) ? Math.min(10, Math.max(0, Number(it.priority))) : 5,
        done: it.done === true, pinned: it.pinned === true,
        order: Number.isFinite(it.order) ? it.order : idx
      }));
  } catch { return []; }
}

let items = loadItems();
let rate = validNumber(readStorage(RATE_KEY)) || DEFAULT_RATE;
let sortMode = readStorage(SORT_KEY) === 'manual' ? 'manual' : 'priority';
let editingId = null;
let draggedId = null;

const rateInput = document.getElementById('rate');
const listEl = document.getElementById('list');
const emptyMsg = document.getElementById('emptyMsg');
const addForm = document.getElementById('addForm');
const nameInput = document.getElementById('name');
const priceInput = document.getElementById('price');
const currencyInput = document.getElementById('currency');
const priorityInput = document.getElementById('priority');
const priorityVal = document.getElementById('priorityVal');
const addBtn = document.getElementById('addBtn');
const editActions = document.getElementById('editActions');
const cancelBtn = document.getElementById('cancelBtn');
const sortByPriorityBtn = document.getElementById('sortByPriority');
const sortByManualBtn = document.getElementById('sortByManual');

rateInput.value = rate;
updateSortButtons();

function save() {
  writeStorage(STORAGE_KEY, JSON.stringify(items));
}

function nextOrder() {
  return items.reduce((max, it) => Math.max(max, it.order), -1) + 1;
}

function fmt(n) {
  return n.toLocaleString('ru-RU', { maximumFractionDigits: 2 });
}

function convert(item) {
  if (item.currency === 'CNY') {
    return { cny: item.price, kzt: item.price * rate };
  } else {
    return { cny: item.price / rate, kzt: item.price };
  }
}

function prioClass(p) {
  if (p <= 3) return 'low';
  if (p <= 6) return 'mid';
  return '';
}

function updateSortButtons() {
  sortByPriorityBtn.classList.toggle('active', sortMode === 'priority');
  sortByManualBtn.classList.toggle('active', sortMode === 'manual');
  sortByPriorityBtn.setAttribute('aria-pressed', sortMode === 'priority');
  sortByManualBtn.setAttribute('aria-pressed', sortMode === 'manual');
}

function sortedItems() {
  return [...items].sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
    if (sortMode === 'priority' && a.priority !== b.priority) {
      return b.priority - a.priority;
    }
    return a.order - b.order;
  });
}

function render() {
  const sorted = sortedItems();

  listEl.innerHTML = '';
  emptyMsg.style.display = sorted.length ? 'none' : 'block';

  for (const [index, item] of sorted.entries()) {
    const { cny, kzt } = convert(item);
    const li = document.createElement('li');
    li.className = 'item'
      + (item.done ? ' done' : '')
      + (item.pinned ? ' pinned' : '');
    li.draggable = sortMode === 'manual';
    li.dataset.id = item.id;

    li.innerHTML = `
      <span class="handle" aria-hidden="true">${sortMode === 'manual' ? '⠿' : ''}</span>
      <input type="checkbox" class="check" aria-label="Куплено: ${escapeAttr(item.name)}" ${item.done ? 'checked' : ''}>
      <div class="info">
        <div class="name">${escapeHtml(item.name)}</div>
        <div class="prices">¥${fmt(cny)} · ₸${fmt(kzt)}</div>
      </div>
      <div class="prio ${prioClass(item.priority)}">${item.priority}</div>
      ${sortMode === 'manual' ? '<span class="move-controls"><button type="button" class="icon-btn move-up" aria-label="Переместить выше">▲</button><button type="button" class="icon-btn move-down" aria-label="Переместить ниже">▼</button></span>' : ''}
      <button type="button" class="icon-btn pin${item.pinned ? ' active' : ''}" aria-label="${item.pinned ? 'Открепить' : 'Закрепить'}: ${escapeAttr(item.name)}" aria-pressed="${item.pinned}">📌</button>
      <button type="button" class="icon-btn edit" aria-label="Редактировать: ${escapeAttr(item.name)}">✎</button>
      <button type="button" class="icon-btn del" aria-label="Удалить: ${escapeAttr(item.name)}">×</button>
    `;

    if (sortMode === 'manual') {
      const up = li.querySelector('.move-up');
      const down = li.querySelector('.move-down');
      up.disabled = index === 0 || !sameGroup(item, sorted[index - 1]);
      down.disabled = index === sorted.length - 1 || !sameGroup(item, sorted[index + 1]);
      up.addEventListener('click', () => moveItem(item, sorted[index - 1]));
      down.addEventListener('click', () => moveItem(item, sorted[index + 1]));
    }

    li.querySelector('.check').addEventListener('change', () => {
      item.done = !item.done;
      save();
      render();
    });
    li.querySelector('.pin').addEventListener('click', () => {
      item.pinned = !item.pinned;
      save();
      render();
    });
    li.querySelector('.edit').addEventListener('click', () => startEdit(item.id));
    li.querySelector('.del').addEventListener('click', () => {
      items = items.filter(i => i.id !== item.id);
      if (editingId === item.id) cancelEdit();
      save();
      render();
    });

    li.addEventListener('dragstart', e => {
      draggedId = item.id;
      e.dataTransfer.setData('text/plain', String(item.id));
      e.dataTransfer.effectAllowed = 'move';
    });
    li.addEventListener('dragend', () => {
      draggedId = null;
      listEl.querySelectorAll('.dragover').forEach(el => el.classList.remove('dragover'));
    });
    li.addEventListener('dragover', e => {
      const source = items.find(i => i.id === draggedId);
      if (sortMode !== 'manual' || !source || !sameGroup(source, item)) return;
      e.preventDefault();
      li.classList.add('dragover');
    });
    li.addEventListener('dragleave', () => li.classList.remove('dragover'));
    li.addEventListener('drop', e => {
      e.preventDefault();
      li.classList.remove('dragover');
      const source = items.find(i => i.id === draggedId);
      if (sortMode !== 'manual' || !source || source.id === item.id || !sameGroup(source, item)) return;
      const group = sortedItems().filter(i => sameGroup(i, source));
      const fromIdx = group.findIndex(i => i.id === source.id);
      const toIdx = group.findIndex(i => i.id === item.id);
      group.splice(fromIdx, 1);
      group.splice(toIdx, 0, source);
      group.forEach((it, idx) => { it.order = idx; });
      draggedId = null;
      save();
      render();
    });

    listEl.appendChild(li);
  }
}

function sameGroup(a, b) {
  return b && a.done === b.done && a.pinned === b.pinned;
}

function moveItem(item, neighbor) {
  if (!sameGroup(item, neighbor)) return;
  const group = sortedItems().filter(i => sameGroup(i, item));
  const fromIdx = group.findIndex(i => i.id === item.id);
  const toIdx = group.findIndex(i => i.id === neighbor.id);
  group.splice(fromIdx, 1);
  group.splice(toIdx, 0, item);
  group.forEach((it, idx) => { it.order = idx; });
  save();
  render();
  const moved = [...listEl.children].find(el => el.dataset.id === String(item.id));
  moved?.querySelector(toIdx < fromIdx ? '.move-up' : '.move-down')?.focus();
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function escapeAttr(s) {
  return escapeHtml(s).replaceAll('"', '&quot;').replaceAll("'", '&#39;');
}

function startEdit(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  editingId = id;
  nameInput.value = item.name;
  priceInput.value = item.price;
  currencyInput.value = item.currency;
  priorityInput.value = item.priority;
  priorityVal.textContent = item.priority;
  addBtn.textContent = 'Сохранить';
  addBtn.setAttribute('aria-label', 'Сохранить товар');
  addForm.classList.add('editing');
  editActions.style.display = 'flex';
  nameInput.focus();
}

function cancelEdit() {
  editingId = null;
  nameInput.value = '';
  priceInput.value = '';
  priorityInput.value = 5;
  priorityVal.textContent = 5;
  addBtn.textContent = '+';
  addBtn.setAttribute('aria-label', 'Добавить товар');
  addForm.classList.remove('editing');
  editActions.style.display = 'none';
}

cancelBtn.addEventListener('click', cancelEdit);

priorityInput.addEventListener('input', () => {
  priorityVal.textContent = priorityInput.value;
});

rateInput.addEventListener('change', () => {
  const v = validNumber(rateInput.value);
  if (v !== null && rateInput.validity.valid) {
    rate = v;
    writeStorage(RATE_KEY, String(rate));
    render();
  } else {
    rateInput.value = rate;
  }
});

sortByPriorityBtn.addEventListener('click', () => {
  sortMode = 'priority';
  writeStorage(SORT_KEY, sortMode);
  updateSortButtons();
  render();
});
sortByManualBtn.addEventListener('click', () => {
  sortMode = 'manual';
  writeStorage(SORT_KEY, sortMode);
  updateSortButtons();
  render();
});

addForm.addEventListener('submit', e => {
  e.preventDefault();
  const name = nameInput.value.trim();
  const price = validNumber(priceInput.value);
  if (!name) { nameInput.focus(); return; }
  if (price === null || !priceInput.validity.valid) { priceInput.focus(); return; }

  if (editingId !== null) {
    const item = items.find(i => i.id === editingId);
    if (item) {
      item.name = name;
      item.price = price;
      item.currency = currencyInput.value;
      item.priority = parseInt(priorityInput.value, 10);
    }
    cancelEdit();
  } else {
    items.push({
      id: Date.now() + Math.random(),
      name,
      price,
      currency: currencyInput.value,
      priority: parseInt(priorityInput.value, 10),
      done: false,
      pinned: false,
      order: nextOrder()
    });
    nameInput.value = '';
    priceInput.value = '';
    priorityInput.value = 5;
    priorityVal.textContent = 5;
    nameInput.focus();
  }
  save();
  render();
});

render();
</script>

</body>
</html>
